# --- OneSmart 配置专用覆写 ---
[General]
DISABLE_UDP_QUIC = 1

# 自动下载 OneSmart 模板
DOWNLOAD_FILE = url=https://github.com/666OS/YYDS/raw/main/mihomo/config/OneSmart.yaml, path=/etc/openclash/config/OneSmart.yaml, cron=0 6 * * *, force=false

# 设置默认配置文件
CONFIG_FILE = /etc/openclash/config/OneSmart.yaml

[Overwrite]

# ============================
# 写入订阅 URL（由环境变量提供）
# ============================

ruby_map_edit "$CONFIG_FILE" "['proxy-providers']" "花云" "['url']" "$EN_KEY1"
ruby_map_edit "$CONFIG_FILE" "['proxy-providers']" "AZ" "['url']" "$EN_KEY2"

# ============================
# 追加 rule-providers（带国内图标）
# ============================

ruby_map_add "$CONFIG_FILE" "['rule-providers']" "PT" \
"{
  'type' => 'http',
  'behavior' => 'domain',
  'format' => 'mrs',
  'url' => 'https://github.com/666OS/rules/raw/release/mihomo/domain/Download.mrs',
  'path' => './rules/pt-download.mrs',
  'interval' => 86400,
  'icon' => 'https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/China.png'
}"

ruby_map_add "$CONFIG_FILE" "['rule-providers']"  "PT-D" \
"{
  'type' => 'http',
  'behavior' => 'classical',
  'format' => 'yaml',
  'url' => 'https://raw.githubusercontent.com/fengwei0789/Rule/refs/heads/main/DST-PORT-direct.yaml',
  'path' => './rules/pt-download1.yaml',
  'interval' => 86400,
  'icon' => 'https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/China.png'
}"

# ============================
# 追加 rules（走国内流量）
# ============================

ruby_array_add "$CONFIG_FILE" "['rules']" "RULE-SET,PT,国内流量"
ruby_array_add "$CONFIG_FILE" "['rules']" "RULE-SET,PT-D,国内流量"
