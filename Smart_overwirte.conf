# --- OneSmart 配置专用覆写 ---
[General]
DISABLE_UDP_QUIC = 1

DOWNLOAD_FILE = url=https://raw.githubusercontent.com/666OS/YYDS/main/mihomo/config/OneSmart.yaml, path=/etc/openclash/config/OneSmart.yaml, cron=0 6 * * *, force=false
CONFIG_FILE = /etc/openclash/config/OneSmart.yaml

[Overwrite]

# 写入订阅 URL
ruby_map_edit "$CONFIG_FILE" "['proxy-providers']['花云']['url']" "$EN_KEY1"
ruby_map_edit "$CONFIG_FILE" "['proxy-providers']['AZ']['url']" "$EN_KEY2"
SUB_INFO_URL = $EN_KEY1

# 注入 PT rule-providers
ruby_merge_hash "$CONFIG_FILE" "['rule-providers']" \
"'PT'=>{'type'=>'http','behavior'=>'domain','format'=>'mrs','url'=>'https://github.com/666OS/rules/raw/release/mihomo/domain/Download.mrs','path'=>'./rule_provider/PT.mrs','interval'=>86400}"

ruby_merge_hash "$CONFIG_FILE" "['rule-providers']" \
"'PT-D'=>{'type'=>'http','behavior'=>'classical','format'=>'yaml','url'=>'https://raw.githubusercontent.com/fengwei0789/Rule/main/DST-PORT-direct.yaml','path'=>'./rule_provider/PT-D.yaml','interval'=>86400}"

# 追加 rules
ruby_array_add "$CONFIG_FILE" "['rules']" "RULE-SET,PT,国内流量"
ruby_array_add "$CONFIG_FILE" "['rules']" "RULE-SET,PT-D,国内流量"
