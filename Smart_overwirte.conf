# --- OneSmart 配置专用覆写 ---
[General]
DISABLE_UDP_QUIC = 1

# 自动下载 OneSmart 模板
DOWNLOAD_FILE = url=https://raw.githubusercontent.com/666OS/YYDS/main/mihomo/config/OneSmart.yaml, path=/etc/openclash/config/OneSmart.yaml, cron=0 6 * * *, force=false

# 设置默认配置文件
CONFIG_FILE = /etc/openclash/config/OneSmart.yaml

[Overwrite]

# ============================
# 写入订阅 URL（由环境变量提供）
# ============================

ruby_map_edit "$CONFIG_FILE" "['proxy-providers']['花云']['url']" "$EN_KEY1"
ruby_map_edit "$CONFIG_FILE" "['proxy-providers']['AZ']['url']" "$EN_KEY2"

SUB_INFO_URL = $EN_KEY1

# ============================
# 逐字段注入 PT rule-providers
# ============================

ruby_map_edit "$CONFIG_FILE" "['rule-providers']['PT']['type']" "http"
ruby_map_edit "$CONFIG_FILE" "['rule-providers']['PT']['behavior']" "domain"
ruby_map_edit "$CONFIG_FILE" "['rule-providers']['PT']['format']" "mrs"
ruby_map_edit "$CONFIG_FILE" "['rule-providers']['PT']['url']" "https://github.com/666OS/rules/raw/release/mihomo/domain/Download.mrs"
ruby_map_edit "$CONFIG_FILE" "['rule-providers']['PT']['path']" "./rule_provider/PT.mrs"
ruby_map_edit "$CONFIG_FILE" "['rule-providers']['PT']['interval']" "86400"

ruby_map_edit "$CONFIG_FILE" "['rule-providers']['PT-D']['type']" "http"
ruby_map_edit "$CONFIG_FILE" "['rule-providers']['PT-D']['behavior']" "classical"
ruby_map_edit "$CONFIG_FILE" "['rule-providers']['PT-D']['format']" "yaml"
ruby_map_edit "$CONFIG_FILE" "['rule-providers']['PT-D']['url']" "https://raw.githubusercontent.com/fengwei0789/Rule/main/DST-PORT-direct.yaml"
ruby_map_edit "$CONFIG_FILE" "['rule-providers']['PT-D']['path']" "./rule_provider/PT-D.yaml"
ruby_map_edit "$CONFIG_FILE" "['rule-providers']['PT-D']['interval']" "86400"

# ============================
# 追加 rules（走国内流量）
# ============================

ruby_array_add "$CONFIG_FILE" "['rules']" "RULE-SET,PT,国内流量"
ruby_array_add "$CONFIG_FILE" "['rules']" "RULE-SET,PT-D,国内流量"
