[YAML]
+rule-providers:
  pt:
    type: http
    behavior: domain
    format: text
    url: "https://raw.githubusercontent.com/fengwei0789/Rule/refs/heads/main/Download.txt"
    interval: 86400
    path: ./rule_provider/pt.txt

  ptD:
    type: http
    behavior: classical
    format: yaml
    url: "https://raw.githubusercontent.com/fengwei0789/Rule/main/DST-PORT-direct.yaml"
    interval: 86400
    path: ./rule_provider/ptD.yaml

+rules:
  - DOMAIN-SUFFIX,hyhbk.com,DIRECT
  - DOMAIN-SUFFIX,yemett.com,DIRECT
  - RULE-SET,pt,直接连接
  - RULE-SET,ptD,直接连接
