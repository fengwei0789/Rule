[YAML]
+rule-providers:
  pt:
    type: http
    behavior: domain
    format: mrs
    url: "https://github.com/666OS/rules/raw/release/mihomo/domain/Download.mrs"
    interval: 86400
    path: ./rule_provider/pt.mrs

  ptD:
    type: http
    behavior: classical
    format: yaml
    url: "https://raw.githubusercontent.com/fengwei0789/Rule/main/DST-PORT-direct.yaml"
    interval: 86400
    path: ./rule_provider/ptD.yaml

+rules:
  - DOMAIN-SUFFIX,hyhbk.com,DIRECT
  - DOMAIN-SUFFIX,yemett.com,DIRECT
  - RULE-SET,pt,DIRECT
  - RULE-SET,ptD,DIRECT
