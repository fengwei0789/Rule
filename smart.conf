# --- 以下为 OneSmart 配置专用覆写 ---
[General]
DISABLE_UDP_QUIC = 1

[Overwrite]
# EN_KEY 为对应模块需要用户指定的环境变量值
# EN_KEY1=URL1;EN_KEY2=URL2;EN_KEY3=URL3
# 其他 Ruby 编辑函数请参考 openclash_custom_overwrite.sh

ruby_map_edit "$CONFIG_FILE" "['proxy-providers']" "优质服务商" "['url']" "$EN_KEY1"
ruby_map_edit "$CONFIG_FILE" "['proxy-providers']" "备用服务商" "['url']" "$EN_KEY2"

#pt附加规则
+rule-providers:
  pt:
    type: http
    behavior: domain
    format: mrs
    url: "https://raw.githubusercontent.com/666OS/rules/release/mihomo/domain/Download.mrs"
    interval: 86400
    path: ./ruleset/pt.mrs

  ptD:
    type: http
    behavior: classical
    format: yaml
    url: "https://raw.githubusercontent.com/fengwei0789/Rule/main/DST-PORT-direct.yaml"
    interval: 86400
    path: ./ruleset/ptD.yaml

+rules:
  - RULE-SET,pt,DIRECT
  - RULE-SET,ptD,DIRECT
