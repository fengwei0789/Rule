# --- 以下为 OneSmart 配置专用覆写 ---
[General]
DISABLE_UDP_QUIC = 1

[Overwrite]
# EN_KEY 为对应模块需要用户指定的环境变量值
# EN_KEY1=URL1;EN_KEY2=URL2;EN_KEY3=URL3
# 其他 Ruby 编辑函数请参考 openclash_custom_overwrite.sh

ruby_map_edit "$CONFIG_FILE" "['proxy-providers']" "花云" "['url']" "$EN_KEY1"
ruby_map_edit "$CONFIG_FILE" "['proxy-providers']" "AZ" "['url']" "$EN_KEY2"
